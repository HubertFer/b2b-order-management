services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
    ports:
      - "${APP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  k6:
    image: grafana/k6:1.3.0
    profiles: ["load-test"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8081
    volumes:
      - ./load-test:/scripts:ro
    command: run /scripts/orders.js

volumes:
  postgres-data:
